<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Aura Clean Ghana logo concept</title>
<desc>A circular emblem with layered blue aura rings around a stylized water droplet with a shine highlight and small bubbles, paired with an "Aura Clean" wordmark, "GHANA" subtitle, and the tagline "Luxury residential and commercial care".</desc>
<style>
.wm{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:600;fill:#0b3d5c;}
.sub{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:400;fill:#1f7fb8;letter-spacing:4px;}
</style>
<defs>
<linearGradient id="dropfill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#3fa9dc"/>
<stop offset="100%" stop-color="#1a6ea8"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="680" height="380" fill="#ffffff"/>

<circle cx="200" cy="150" r="95" fill="none" stroke="#bfe1f2" stroke-width="1.5"/>
<circle cx="200" cy="150" r="78" fill="none" stroke="#8fcbea" stroke-width="2"/>
<circle cx="200" cy="150" r="62" fill="#eaf6ff"/>

<path d="M200 100 C222 132, 236 152, 236 172 C236 194, 220 210, 200 210 C180 210, 164 194, 164 172 C164 152, 178 132, 200 100 Z" fill="url(#dropfill)"/>
<ellipse cx="188" cy="160" rx="7" ry="14" fill="#eaf6ff" opacity="0.55"/>

<circle cx="252" cy="108" r="9" fill="#8fcbea"/>
<circle cx="150" cy="188" r="6" fill="#8fcbea"/>
<circle cx="264" cy="130" r="4" fill="#bfe1f2"/>

<text x="341" y="140" class="wm" font-size="40">Aura Clean</text>
<text x="341" y="168" class="sub" font-size="14">GHANA</text>
<line x1="341" y1="182" x2="611" y2="182" stroke="#8fcbea" stroke-width="1.5"/>
<text x="341" y="205" class="sub" font-size="10" letter-spacing="0.8">
<tspan x="341" dy="0">LUXURY RESIDENTIAL AND</tspan>
<tspan x="341" dy="1.3em">COMMERCIAL CARE</tspan>
</text>
</svg>
